# Tidebound — expose furnace cooking state for the Fast Smelting enchantment (TB-SMELT-001).
# Vanilla exposes no event to speed up an in-progress smelt. AbstractFurnaceMenu#container is the
# AbstractFurnaceBlockEntity itself for a real furnace; both it and the three cooking fields below
# are package-private in vanilla.
public net.minecraft.world.inventory.AbstractFurnaceMenu container
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTime
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingProgress
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingTotalTime
