name: Build Tidebound

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate Tidebound content
        working-directory: core
        run: python tools/validate_content.py

      - name: Build and test
        working-directory: core
        run: ./gradlew build --no-daemon

      - name: Upload testable JAR
        uses: actions/upload-artifact@v4
        with:
          name: tidebound-core-${{ github.sha }}
          path: core/build/libs/*.jar
          if-no-files-found: error
